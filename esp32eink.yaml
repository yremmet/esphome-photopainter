# This YAML describes a Waveshare ESP32S3-ePaper-1.54 development board
# Author: GHF - Dec-2025
# Erweitert um: ES8311 Audio (Media Player), Mikrofon, Wake Word, Voice Assistant
#
# Power control:
#   - if dev is off (blank screen and green LED off): Press Power button and hold for more than 3 secs
#   - if dev is on (green LED is on): Press Power button once and dev will turn off completely
#
# HINWEIS: Deep Sleep ist auskommentiert (unten), weil Dauerzuhören und Deep Sleep
# sich ausschließen. Für den Voice-Betrieb das Board an USB betreiben.
#
esphome:
  name: esp32eink
  friendly_name: esp32eink
  on_boot:
    then:
      - output.turn_on: vbat_power_enable # "connect" battery
      - output.turn_on: epd_power_enable # turn ePaper display on
      - light.turn_on: green_led
  on_shutdown:
    then:
      - lambda: |- # GHF: This is required for the battery to keep connected during deep_sleep
          gpio_hold_en(GPIO_NUM_17);
      - component.update: my_display
      - delay: 3s

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 8MB
  cpu_frequency: 240MHz # 80 MHz reicht nicht für Audio + Wake Word
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret esp32eink__encryption_key
  on_client_connected:
    - display.page.show: pg_main
    - delay: 5s
    - component.update: my_display

ota:
  - platform: esphome
    password: !secret esp32eink__ota_password

wifi:
  ssid: SH
  password: !secret wifi_password
  power_save_mode: HIGH

  ap:
    ssid: "Esp32Eink Fallback Hotspot"
    password: !secret esp32eink__ap_password

captive_portal:

# Audio-Rail (GPIO42, LOW = an) muss VOR dem I2C-Bus hochkommen,
# sonst hält der stromlose ES8311 beim Kaltstart SCL auf LOW.
power_supply:
  - id: audio_power
    pin:
      number: GPIO42
      inverted: true
    enable_on_boot: true
    keep_on_time: 0s

output:
  - platform: gpio
    pin: GPIO6 # EPD3V3_EN pin GHF: Required by the ePaper display!!!
    id: epd_power_enable
    inverted: True

  - platform: gpio
    pin:
      number: GPIO17 # BATT_Control pin GHF: Required by the battery to work!!!
    id: vbat_power_enable

  - platform: gpio
    pin: GPIO3
    id: green_led_pin
    inverted: True

  - platform: gpio
    pin: GPIO46 # NS4150B Verstärker-Enable
    id: speaker_amp

light:
  - platform: binary
    output: green_led_pin
    id: green_led
    name: green_led

spi:
  clk_pin: GPIO12 # SCK
  mosi_pin: GPIO13 # SDO

i2c:
  sda: GPIO47
  scl: GPIO48
  scan: true

# ---------- Audio ----------
i2s_audio:
  - id: i2s_shared
    i2s_lrclk_pin: GPIO38
    i2s_bclk_pin: GPIO15
    i2s_mclk_pin: GPIO14

audio_dac:
  - platform: es8311
    id: es8311_dac
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000
    use_microphone: false # NICHT true – das Board hat ein analoges Mikro
    mic_gain: 24dB

speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    i2s_audio_id: i2s_shared
    i2s_dout_pin: GPIO45
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: 16000
    bits_per_sample: 16bit

microphone:
  - platform: i2s_audio
    id: va_mic
    i2s_audio_id: i2s_shared
    i2s_din_pin: GPIO16
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 16bit

media_player:
  - platform: speaker
    id: spk_player
    name: "Lautsprecher"
    volume_initial: 0.75
    volume_min: 0.5
    volume_max: 0.85
    announcement_pipeline:
      speaker: i2s_audio_speaker
      format: FLAC
      sample_rate: 16000
      num_channels: 1
    media_pipeline:
      speaker: i2s_audio_speaker
      format: FLAC
      sample_rate: 16000
      num_channels: 1
    # Mikro/Lautsprecher teilen sich einen I2S-Bus: Handover NUR hier,
    # niemals zusätzlich microphone.capture verwenden.
    on_play:
      - micro_wake_word.stop:
      - output.turn_on: speaker_amp
    on_announcement:
      - micro_wake_word.stop:
      - output.turn_on: speaker_amp
    on_idle:
      - output.turn_off: speaker_amp
      - script.execute: restart_mww

micro_wake_word:
  id: mww
  microphone:
    microphone: va_mic
    channels: 0
    gain_factor: 4
  models:
    - model: hey_jarvis # alternativ: okay_nabu, hey_mycroft, alexa
  on_wake_word_detected:
    - voice_assistant.start:

voice_assistant:
  id: va
  microphone: va_mic
  media_player: spk_player
  use_wake_word: false # übernimmt micro_wake_word
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - micro_wake_word.stop:
  on_error:
    - micro_wake_word.start:

script:
  - id: restart_mww
    then:
      - wait_until:
          not:
            media_player.is_announcing:
      - wait_until:
          not:
            speaker.is_playing:
              id: i2s_audio_speaker
      - delay: 100ms
      - micro_wake_word.start:

# ---------- Display ----------
external_components:
  - source:
      type: local
      path: components
    components: [epaper_154_gray4]

display:
  - platform: epaper_154_gray4 # 200x200 pixels, 4 gray levels
    cs_pin: GPIO11
    dc_pin: GPIO10
    busy_pin: GPIO8
    reset_pin: GPIO9
    update_interval: never
    reset_duration: 2ms
    full_update_every: 1
    rotation: 90
    id: my_display
    pages:
    - id: pg_offline
      lambda: |-
        it.print(100, 100, id(f_24b), TextAlign::CENTER, "Starte...");

    - id: pg_main
      lambda: |-
        // ---------- Kopfzeile ----------
        it.filled_rectangle(0, 0, 200, 26, COLOR_ON);
        it.print(6, 13, id(f_16b), COLOR_OFF, TextAlign::CENTER_LEFT, "Wohnzimmer");
        auto now = id(time_comp).now();
        if (now.is_valid())
          it.strftime(194, 13, id(f_16b), COLOR_OFF, TextAlign::CENTER_RIGHT, "%H:%M", now);

        // Batterie-Symbol (3.4 V = leer, 4.2 V = voll)
        float vb = id(batt_voltage).state;
        float frac = isnan(vb) ? 0.0f : fminf(fmaxf((vb - 3.4f) / 0.8f, 0.0f), 1.0f);
        it.rectangle(118, 8, 20, 11, COLOR_OFF);
        it.filled_rectangle(138, 11, 2, 5, COLOR_OFF);
        int bw = (int) (frac * 16);
        if (bw > 0) it.filled_rectangle(120, 10, bw, 7, COLOR_OFF);

        // ---------- Ist-Temperatur ----------
        float t = id(wz_temp).state;
        it.print(4, 66, id(f_icon_32), TextAlign::CENTER_LEFT, "\U000F050F");
        if (isnan(t))
          it.print(112, 64, id(f_48), TextAlign::CENTER, "--.-");
        else
          it.printf(112, 64, id(f_48), TextAlign::CENTER, "%.1f°", t);

        // ---------- Zieltemperatur (invertiert, wenn geheizt wird) ----------
        float z = id(wz_target).state;
        bool heating = id(wz_action).state == "heating";
        char buf[32];
        if (isnan(z))
          snprintf(buf, sizeof(buf), "Ziel --.-°");
        else if (heating)
          snprintf(buf, sizeof(buf), "Heizt auf %.1f°", z);
        else
          snprintf(buf, sizeof(buf), "Ziel %.1f°", z);

        if (heating) {
          it.filled_rectangle(30, 96, 140, 22, COLOR_ON);
          it.print(100, 107, id(f_16), COLOR_OFF, TextAlign::CENTER, buf);
        } else {
          it.rectangle(30, 96, 140, 22, COLOR_ON);
          it.print(100, 107, id(f_16), COLOR_ON, TextAlign::CENTER, buf);
        }

        // ---------- Luftqualität: zwei Kacheln ----------
        it.line(0, 126, 199, 126);
        it.line(100, 126, 100, 199);

        auto tile = [&](int x0, const char *icon, const char *label, float val,
                        float ok_below, float warn_below) {
          int cx = x0 + 50;
          it.print(x0 + 8, 139, id(f_icon_20), TextAlign::CENTER_LEFT, icon);
          it.print(x0 + 32, 139, id(f_12), TextAlign::CENTER_LEFT, label);
          if (isnan(val)) {
            it.print(cx, 160, id(f_24b), TextAlign::CENTER, "--");
            return;
          }
          it.printf(cx, 160, id(f_24b), TextAlign::CENTER, "%.0f", val);
          if (val >= warn_below) {          // schlecht -> schwarzes Badge
            it.filled_rectangle(x0 + 15, 177, 70, 18, COLOR_ON);
            it.print(cx, 186, id(f_12), COLOR_OFF, TextAlign::CENTER, "Lüften!");
          } else if (val >= ok_below) {     // mäßig -> umrandet
            it.rectangle(x0 + 15, 177, 70, 18, COLOR_ON);
            it.print(cx, 186, id(f_12), TextAlign::CENTER, "mäßig");
          } else {                          // gut -> nur Text
            it.print(cx, 186, id(f_12), TextAlign::CENTER, "gut");
          }
        };

        // Schwellen: CO2 800/1200 ppm, VOC 250/2000 ppb (Airthings-Empfehlung)
        tile(0,   "\U000F07E4", "CO2 ppm", id(wz_co2).state, 800, 1200);
        tile(101, "\U000F0D43", "VOC ppb", id(wz_voc).state, 250, 2000);

    - id: pg_off
      lambda: |-
        it.filled_rectangle(0, 0, 200, 200, COLOR_OFF);

    - id: pg_low_batt
      lambda: |-
        it.print(100, 85, id(f_24b), TextAlign::CENTER, "Akku");
        it.print(100, 115, id(f_24b), TextAlign::CENTER, "zu schwach");

font:
  - file:
      type: gfonts
      family: Cousine
      weight: 700
    id: font_36
    size: 36
  - file:
      type: gfonts
      family: Cousine
      weight: 700
    id: font_24
    size: 24
  - file:
      type: gfonts
      family: Cousine
      weight: 700
    id: font_16
    size: 16

  - file: { type: gfonts, family: Roboto, weight: 700 }
    id: f_48
    size: 48
    glyphs: "0123456789.-°"
  - file: { type: gfonts, family: Roboto, weight: 700 }
    id: f_24b
    size: 24
    glyphsets: [GF_Latin_Core]
  - file: { type: gfonts, family: Roboto, weight: 700 }
    id: f_16b
    size: 16
    glyphsets: [GF_Latin_Core]
  - file: { type: gfonts, family: Roboto, weight: 400 }
    id: f_16
    size: 16
    glyphsets: [GF_Latin_Core]
  - file: { type: gfonts, family: Roboto, weight: 400 }
    id: f_12
    size: 12
    glyphsets: [GF_Latin_Core]
  # Material Design Icons
  - file:
      type: web
      url: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: f_icon_32
    size: 32
    glyphs:
      - "\U000F050F" # mdi:thermometer
  - file:
      type: web
      url: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: f_icon_20
    size: 20
    glyphs:
      - "\U000F07E4" # mdi:molecule-co2
      - "\U000F0D43" # mdi:air-filter

binary_sensor:
  - platform: status
    name: "Node Status"
    id: system_status

  - platform: gpio # Generic button usable by HomeAssistant
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Button 0"
    id: button_0

  - platform: gpio # Power button, to poweroff board when on battery
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
      inverted: True
    id: button_pwr
    on_press: # internally disconnects the battery
      then:
        - display.page.show: pg_off
        - component.update: my_display
        - lambda: |- # GHF: This is required for the next output.turn_off to work
            gpio_hold_dis(GPIO_NUM_17);
        - output.turn_off: vbat_power_enable
       # the rest of this code runs only if USB power is connected
        - display.page.show: pg_main
        - component.update: my_display
        - output.turn_on: vbat_power_enable

time:
  - platform: homeassistant
    id: time_comp
    timezone: "Europe/Berlin"

sensor:
  # --- lokal am Board ---
  - platform: shtcx
    update_interval: 10s
    temperature:
      name: "Temperature"
      id: local_temp
    humidity:
      name: "Humidity"
      id: local_humidity

  - platform: adc
    update_interval: 10s
    pin: GPIO4
    name: "Batt_voltage"
    id: batt_voltage
    attenuation: auto
    filters:
      - multiply: 2.02
    on_value_range:
      - below: 3.4
        then:
          - display.page.show: pg_low_batt
          - component.update: my_display
          - lambda: |-
              gpio_hold_dis(GPIO_NUM_17);
          - output.turn_off: vbat_power_enable

  # --- aus Home Assistant: Wohnzimmer ---
  - platform: homeassistant
    id: wz_temp
    entity_id: sensor.airthings_wave_037753_temperatur
    internal: true
  - platform: homeassistant
    id: wz_target
    entity_id: climate.wohnzimmer
    attribute: temperature
    internal: true
  - platform: homeassistant
    id: wz_co2
    entity_id: sensor.airthings_wave_037753_kohlendioxid
    internal: true
  - platform: homeassistant
    id: wz_voc
    entity_id: sensor.airthings_wave_037753_voc_teile
    internal: true

text_sensor:
  - platform: homeassistant
    id: wz_action
    entity_id: climate.wohnzimmer
    attribute: hvac_action
    internal: true

button:
  - platform: template # to force a display update from HomeAssistant
    name: "display update"
    on_press:
      then:
        - component.update: my_display

# Wenn Wake Word oder Audio stottern: als Erstes den BLE-Proxy auskommentieren.
esp32_ble_tracker:
bluetooth_proxy:
  active: true

